
services:
  db:
    image: dhi.io/postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: todopassword
      POSTGRES_DB: tododb
    volumes:
      - todo_data:/var/lib/postgresql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tododb"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgres://postgres:todopassword@db:5432/tododb?sslmode=disable
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      - backend

volumes:
  todo_data:
